[workspace]
resolver = "2"
members = [
  "crates/vocamesh-core",
  "crates/vocamesh-agent",
  "crates/vocamesh-runtime",
  "frontend/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
tauri = "2"
